<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ferrers Diagram Rank-Metric Bounds</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Optimal Ferrers Diagram Rank-Metric Codes</h1>
      <p>
        Query best-known bounds on the dimension <strong>k</strong> for
        Ferrers-diagram rank-metric codes with inputs <strong>(F, d, q)</strong>
        over <strong>F<sub>q</sub></strong>.
      </p>

      <form id="query-form" novalidate>
        <label for="columns">Ferrers columns (comma-separated integers)</label>
        <input id="columns" name="columns" placeholder="e.g. 1,2,3,3" required />

        <div class="row">
          <div>
            <label for="distance">Minimum distance d</label>
            <input id="distance" name="distance" type="number" min="1" required />
          </div>
          <div>
            <label for="field">Field size q</label>
            <input id="field" name="field" type="number" min="2" required />
          </div>
        </div>

        <button type="submit">Show bounds</button>
      </form>

      <p id="limits" class="muted"></p>
      <p id="error" role="alert" class="error"></p>

      <section id="results" class="results" hidden>
        <h2>Result</h2>
        <p id="summary"></p>

        <div class="diagram-and-bounds">
          <div>
            <div class="diagram-header">
              <h3>Ferrers diagram</h3>
              <div class="diagram-order-controls">
                <label class="switch-label" for="diagram-order-toggle">
                  <span>Ascending</span>
                  <span class="switch">
                    <input
                      id="diagram-order-toggle"
                      type="checkbox"
                      role="switch"
                    />
                    <span class="switch-slider" aria-hidden="true"></span>
                  </span>
                  <span>Descending</span>
                </label>
                <span
                  id="order-mode-badge"
                  class="order-mode-badge"
                  role="status"
                  aria-live="polite"
                  aria-atomic="true"
                >
                  Ascending
                </span>
              </div>
            </div>
            <div
              id="diagram"
              class="diagram"
              aria-hidden="true"
            ></div>
            <pre id="diagram-text" class="diagram-text" aria-live="polite"></pre>
          </div>

          <div>
            <h3>Bounds on k</h3>
            <ul id="bounds"></ul>

            <h3>References</h3>
            <ul id="references"></ul>
          </div>
        </div>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
